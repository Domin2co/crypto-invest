spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: crypto-invest
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:crypto-invest}
    username: ${POSTGRES_USER:crypto}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    log-request-details: false

server:
  tomcat:
    accesslog:
      enabled: false

app:
  trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  auth-token-secret: ${AUTH_TOKEN_SECRET:}
  email-from: ${EMAIL_FROM:no-reply@crypto-invest.local}
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  paper-initial-krw: ${PAPER_INITIAL_KRW:1000000}
  paper-trading-kill-switch: ${PAPER_TRADING_KILL_SWITCH:false}
  paper-min-order-amount: ${PAPER_MIN_ORDER_AMOUNT:5000}
  paper-max-order-amount: ${PAPER_MAX_ORDER_AMOUNT:1000000}
  paper-fee-rate: ${PAPER_FEE_RATE:0.0005}
  live-trading-enabled: ${LIVE_TRADING_ENABLED:false}
  live-trading-kill-switch: ${LIVE_TRADING_KILL_SWITCH:true}
  live-daily-limit: ${LIVE_DAILY_LIMIT:0}
  live-max-asset-weight: ${LIVE_MAX_ASSET_WEIGHT:0.35}
  live-trading-confirmation-version: ${LIVE_TRADING_CONFIRMATION_VERSION:2026-09-22}
  live-trading-confirmation-minutes: ${LIVE_TRADING_CONFIRMATION_MINUTES:15}
  upbit-api-base-url: ${UPBIT_API_BASE_URL:https://api.upbit.com}
  bithumb-api-base-url: ${BITHUMB_API_BASE_URL:https://api.bithumb.com}
  credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}
  privacy-policy-version: ${PRIVACY_POLICY_VERSION:2026-09-21}
  paper-league-consent-version: ${PAPER_LEAGUE_CONSENT_VERSION:2026-09-24}

recommendation:
  sources:
    coingecko-demo-api-key: ${COINGECKO_DEMO_API_KEY:}
  portfolio:
    btc-max: ${RECOMMENDATION_BTC_MAX:0.55}
    eth-max: ${RECOMMENDATION_ETH_MAX:0.30}
    major-alt-max: ${RECOMMENDATION_MAJOR_ALT_MAX:0.15}
    high-risk-alt-max: ${RECOMMENDATION_HIGH_RISK_ALT_MAX:0.05}
    total-alt-max: ${RECOMMENDATION_TOTAL_ALT_MAX:0.35}
    cash-min: ${RECOMMENDATION_CASH_MIN:0.10}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: never

---
spring:
  config:
    activate:
      on-profile: production
  mail:
    test-connection: true
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
app:
  email-from: ${EMAIL_FROM}
